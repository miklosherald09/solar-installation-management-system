apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Google Services plugin (Firebase)
apply plugin: "com.google.gms.google-services"

// Copy react-native-vector-icons font files into the APK assets
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Auto-read version from package.json
apply from: 'version.gradle'

/**
 * Load local-only signing secrets from <rootProject>/.gradle/gradle.properties
 * (this folder is Gradle's cache dir AND is gitignored) so that plain
 * `./gradlew bundleRelease` / `assembleRelease` runs sign with the release
 * keystore locally.
 *
 * Safety for CI/Fastlane:
 *  - Only properties NOT already set are filled in here, and command-line
 *    `-P` flags (which fastlane passes via its gradle action) always take
 *    precedence over anything loaded from a file.
 *  - On CI the android/.gradle/ directory does not exist, so this no-ops.
 */
def localSigningPropsFile = rootProject.file(".gradle/gradle.properties")
if (localSigningPropsFile.exists()) {
    def localSigningProps = new Properties()
    localSigningPropsFile.withReader('UTF-8') { localSigningProps.load(it) }
    ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD'].each { key ->
        def val = project.findProperty(key)
        def isPropertyEmpty = val == null || 
                              val.toString().trim().isEmpty() || 
                              val.toString() == "null" || 
                              val.toString() == "nil"
        if (isPropertyEmpty && localSigningProps.getProperty(key)) {
            project.ext.set(key, localSigningProps.getProperty(key))
        }
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 *
 * R8/ProGuard shrinks, optimizes and obfuscates the bytecode, reducing app size.
 * It also emits the `mapping.txt` deobfuscation file (at
 * app/build/outputs/mapping/release/mapping.txt) that should be uploaded to
 * Google Play Console so crashes/ANRs can be de-obfuscated.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.solarimsys"
    defaultConfig {
        applicationId "com.solarimsys"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Read from package.json via version.gradle (fallback for CI overrides)
        versionCode ((project.findProperty('versionCode') as Integer) ?: versionCodeFromPackage)
        versionName (project.findProperty('versionName') ?: versionNameFromPackage)

        // Increase CMake object path max to avoid "Filename longer than 260 characters" errors on Windows
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=512"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Only use release signing if the keystore was actually configured
            // (storeFile will be null if -P flags were missing or passwords were wrong)
            def storeFileProp = project.findProperty('RELEASE_STORE_FILE')
            def storePasswordProp = project.findProperty('RELEASE_STORE_PASSWORD')
            if (storeFileProp != null && !storeFileProp.toString().trim().isEmpty() &&
                storePasswordProp != null && !storePasswordProp.toString().trim().isEmpty() &&
                storePasswordProp.toString() != "null" && storePasswordProp.toString() != "nil") {
                storeFile file(storeFileProp)
                storePassword storePasswordProp
                keyAlias project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Only use release signing if the keystore was actually configured
            // (storeFile will be null if -P flags were missing or passwords were wrong)
            signingConfig signingConfigs.release.storeFile != null
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            // Remove unused resources too (only valid when minifyEnabled is true).
            // If a resource is ever stripped by mistake, disable this or add a
            // `tools:keep` attribute to that resource.
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// React Native configures CMake after the android {} block; append args here so they are not overwritten.
afterEvaluate {
    def cmake = android.defaultConfig.externalNativeBuild.cmake
    if (!cmake.arguments.contains("-DCMAKE_OBJECT_PATH_MAX=512")) {
        cmake.arguments.add("-DCMAKE_OBJECT_PATH_MAX=512")
    }
    def ninjaPath = file("${rootDir}/../tools/ninja/ninja.exe")
    if (ninjaPath.exists()) {
        def ninjaArg = "-DCMAKE_MAKE_PROGRAM=${ninjaPath.absolutePath.replace('\\', '/')}"
        if (!cmake.arguments.contains(ninjaArg)) {
            cmake.arguments.add(ninjaArg)
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Firebase BoM (manages versions for all Firebase SDKs)
    implementation(platform("com.google.firebase:firebase-bom:33.12.0"))
    implementation("com.google.firebase:firebase-messaging")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
